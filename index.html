<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finable — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F3ECDC;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
    }

    .logo-text {
      font-size: 1.65rem;
      font-weight: 800;
      color: #1E4536;
      letter-spacing: 0.06em;
    }

    .tagline {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #8a9485;
      letter-spacing: 0.01em;
    }

    @media (min-width: 640px) {
      .logo-mark {
        width: 40px;
        height: 40px;
      }
      .logo-text {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 157 157" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#1E4536" d="M78.5 74.1C37.6 74.1 4.4 40.9 4.4 0h42.9c0 17.2 14 31.2 31.2 31.2s31.2-14 31.2-31.2h42.9c0 40.9-33.2 74.1-74.1 74.1z"/>
        <path fill="#1E4536" d="M0 156.9v-26.8c10.7 0 19.5-8.7 19.5-19.5S10.7 91.2 0 91.2V64.5c25.5 0 46.2 20.7 46.2 46.2S25.5 156.9 0 156.9z"/>
        <path fill="#1E4536" d="M156.9 84.6c-7.3-2.2-15-3.4-23-3.4-42.7 0-77.6 33.6-79.8 75.7h46.4c2.1-16.6 16.3-29.4 33.4-29.4 8.9 0 17 3.5 23 9.2z"/>
      </svg>
      <span class="logo-text">FINABLE</span>
    </div>
    <p class="tagline">Coming soon</p>
  </div>
</body>
</html>
